<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="extensionName"></title>
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <span class="popup-brand">
          <img src="/icon/48.png" alt="" width="28" height="28" />
          <strong data-i18n="extensionName"></strong>
        </span>
        <button
          id="open-settings"
          class="icon-button"
          type="button"
          data-i18n-aria-label="commonSettings"
          data-i18n-title="commonSettings"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" />
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.36a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.63 15a1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.64 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.63h.01A1.7 1.7 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.64a1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.37 9v.01A1.7 1.7 0 0 0 20.91 10H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15Z" />
          </svg>
        </button>
      </header>

      <fieldset id="controls" class="popup-fields">
        <label class="field">
          <span data-i18n="popupSourceLanguage"></span>
          <select id="source-language"></select>
        </label>
        <span class="direction" aria-hidden="true">→</span>
        <label class="field">
          <span data-i18n="popupTargetLanguage"></span>
          <select id="target-language"></select>
        </label>
        <label class="field">
          <span data-i18n="popupProvider"></span>
          <select id="translation-provider"></select>
        </label>
        <label class="field">
          <span data-i18n="popupResultMode"></span>
          <select id="display-mode">
            <option value="overlay" data-i18n="popupDisplayModeOverlay"></option>
            <option value="panel" data-i18n="popupDisplayModePanel"></option>
          </select>
        </label>
      </fieldset>

      <p id="message" class="popup-message" role="status" hidden></p>
      <button id="select-area" class="primary-button" type="button" disabled>
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3" />
        </svg>
        <span data-i18n="popupSelectArea"></span>
      </button>
      <p id="shortcut-hint" class="shortcut-hint"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
