<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screen OCR Translator Options</title>
  </head>
  <body>
    <main id="app">
      <form class="options-form">
        <section class="settings-section">
          <h2 class="section-title">Translation</h2>
          <div class="field-row">
            <label class="field">
              Target language
              <select name="targetLang"></select>
            </label>
            <label class="field">
              Translation provider
              <select name="translationProvider"></select>
              <span class="field-hint google-provider-note" hidden>
                No API key is required. Rate limits may apply.
              </span>
            </label>
          </div>

          <fieldset class="llm-settings" hidden>
            <legend class="llm-card-title">
              <svg
                class="icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect width="20" height="8" x="2" y="2" rx="2" ry="2" />
                <rect width="20" height="8" x="2" y="14" rx="2" ry="2" />
                <line x1="6" x2="6.01" y1="6" y2="6" />
                <line x1="6" x2="6.01" y1="18" y2="18" />
              </svg>
              LLM endpoint
            </legend>
            <p class="llm-card-subtitle">
              Any OpenAI-compatible server: OpenAI, OpenRouter, or local
              llama.cpp / Ollama / LM Studio.
            </p>
            <label class="field">
              Endpoint URL
              <input
                name="llmBaseUrl"
                type="text"
                class="llm-url-input"
                placeholder="http://localhost:8080/v1"
                spellcheck="false"
              />
              <span class="llm-url-error" aria-live="polite" hidden></span>
            </label>
            <div class="field llm-api-key-field">
              <label for="llm-api-key">API key</label>
              <span class="llm-api-key-row">
                <input
                  id="llm-api-key"
                  name="llmApiKey"
                  type="password"
                  autocomplete="new-password"
                  placeholder="Optional"
                />
                <button
                  type="button"
                  class="llm-api-key-toggle"
                  aria-label="Show API key"
                  aria-pressed="false"
                >
                  <svg
                    class="icon icon-eye"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path
                      d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"
                    />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg
                    class="icon icon-eye-off"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                    <path
                      d="M10.73 5.08A10.43 10.43 0 0 1 12 5c6.5 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"
                    />
                    <path
                      d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61"
                    />
                    <line x1="2" x2="22" y1="2" y2="22" />
                  </svg>
                </button>
              </span>
            </div>
            <div class="llm-model-row">
              <label class="field">
                Model
                <select name="llmModel"></select>
              </label>
              <button type="button" class="btn llm-fetch-models">
                <svg
                  class="icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M21 12a9 9 0 1 1-2.64-6.36L21 8" />
                  <path d="M21 3v5h-5" />
                </svg>
                Fetch models
              </button>
            </div>
            <div class="llm-timeout-row">
              <label class="field llm-timeout">
                Request timeout
                <span class="llm-timeout-input">
                  <input
                    name="llmTimeout"
                    type="number"
                    min="1"
                    step="1"
                    placeholder="60"
                  />
                  <span class="llm-timeout-unit">seconds</span>
                </span>
              </label>
              <label class="llm-checkbox">
                <input type="checkbox" name="llmDisableThinking" />
                <span class="settings-control-text">
                  Disable model thinking
                  <span class="field-hint">
                    Faster answers from reasoning models. Works with llama.cpp/vLLM. WARNING: this setting is not supported by api.openai.com/v1 endpoint.
                  </span>
                </span>
              </label>
            </div>
            <div class="llm-actions">
              <button type="button" class="btn llm-test-connection">
                Test connection
              </button>
              <span class="llm-models-status" aria-live="polite"></span>
            </div>
          </fieldset>
        </section>

        <section class="settings-section">
          <h2 class="section-title">OCR</h2>
          <label class="settings-toggle">
            <span class="settings-control-text">
              <span class="settings-toggle-title">
                GPU acceleration
                <span class="ocr-webgpu-status" hidden></span>
              </span>
              <span class="field-hint">
                Speeds up text recognition using WebGPU. Falls back to the CPU automatically.
              </span>
              <span class="field-hint ocr-webgpu-note" hidden>
                See
                <a
                  href="https://enablegpu.com/guides/firefox/"
                  target="_blank"
                  rel="noopener noreferrer"
                  >how to enable WebGPU in Firefox</a
                >.
              </span>
            </span>
            <input type="checkbox" name="ocrWebGpu" />
          </label>
        </section>

        <section class="settings-section">
          <h2 class="section-title">Display</h2>
          <label class="field">
            Default display mode
            <select name="displayMode">
              <option value="overlay">Overlay (on the selected region)</option>
              <option value="panel">Panel (bottom-right corner)</option>
            </select>
            <span class="field-hint">
              Where the translated text appears after capture.
            </span>
          </label>
        </section>
      </form>

      <footer class="options-footer">
        <p role="status"></p>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
