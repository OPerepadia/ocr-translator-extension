name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build extension (Firefox)
        run: npm run build

      - name: Build extension (Chrome)
        run: npm run build:chrome

      - name: Upload Chrome extension
        uses: actions/upload-artifact@v7
        with:
          name: chrome-extension
          path: .output/chrome-mv3
          if-no-files-found: error
          retention-days: 1

      - name: Upload Firefox extension
        uses: actions/upload-artifact@v7
        with:
          name: firefox-extension
          path: .output/firefox-mv3
          if-no-files-found: error
          retention-days: 1

  chrome-smoke:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Download Chrome extension
        uses: actions/download-artifact@v7
        with:
          name: chrome-extension
          path: .output/chrome-mv3

      - name: Smoke test extension in Chromium
        run: npm run test:browser:chrome

  firefox-smoke:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Firefox extension
        uses: actions/download-artifact@v7
        with:
          name: firefox-extension
          path: .output/firefox-mv3

      - name: Smoke test extension in Firefox
        run: npm run test:browser:firefox
        env:
          SE_AVOID_STATS: true
          SE_BROWSER_VERSION: stable
          SE_FORCE_BROWSER_DOWNLOAD: true
